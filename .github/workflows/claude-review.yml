name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    name: Claude Review (opened head)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' ||
       (github.event.label.name == 're-review' &&
        github.event.sender.id == 281412522))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture job start before checkout or reviewer activity
        id: started
        shell: bash
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head as review subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted review prompt from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: deedseal/proof-check
          ref: main
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Load vendored review prompt
        id: prompt
        shell: bash
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
        run: |
          python3 -I - <<'PY'
          import os
          import uuid
          from pathlib import Path

          prompt = Path('trusted/.github/claude-review/PROMPT.md').read_text(encoding='utf-8')
          prompt += (
              f"\nRepository: {os.environ['GITHUB_REPOSITORY']}\n"
              f"PR number: {os.environ['REVIEW_PR']}\n"
              f"Exact head: {os.environ['REVIEW_HEAD']}\n"
              f"Run ID: {os.environ['GITHUB_RUN_ID']}\n"
          )
          delimiter = uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'prompt<<{delimiter}\n{prompt}\n{delimiter}\n')
          PY

      - name: Review exact PR head
        id: review
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 24
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),LS,mcp__github_inline_comment__create_inline_comment"
          include_fix_links: false
          show_full_output: false
          display_report: false

      - name: Extract Claude review diagnostics
        if: ${{ always() }}
        shell: bash
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          def unavailable(reason):
              return {'available': False, 'reason': reason}

          source_name = os.environ.get('CLAUDE_EXECUTION_FILE')
          if not source_name:
              diagnostics = unavailable('NO_FILE')
          else:
              try:
                  raw = Path(source_name).read_bytes()
              except (OSError, ValueError):
                  diagnostics = unavailable('NO_FILE')
              else:
                  try:
                      messages = json.loads(raw.decode('utf-8'))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      diagnostics = unavailable('UNPARSEABLE')
                  else:
                      if not isinstance(messages, list):
                          diagnostics = unavailable('UNPARSEABLE')
                      else:
                          result = next(
                              (message for message in reversed(messages)
                               if isinstance(message, dict)
                               and message.get('type') == 'result'),
                              None,
                          )
                          if result is None:
                              diagnostics = unavailable('NO_RESULT_MESSAGE')
                          else:
                              diagnostics = {}
                              scalar_rules = {
                                  'num_turns': lambda value: (
                                      not isinstance(value, bool)
                                      and isinstance(value, int) and value >= 0),
                                  'duration_ms': lambda value: (
                                      not isinstance(value, bool)
                                      and isinstance(value, int) and value >= 0),
                                  'is_error': lambda value: isinstance(value, bool),
                                  'subtype': lambda value: (
                                      isinstance(value, str)
                                      and re.fullmatch(r'[A-Za-z0-9_-]{1,128}', value)),
                              }
                              invalid_field = False
                              for field, valid in scalar_rules.items():
                                  value = result.get(field)
                                  if valid(value):
                                      diagnostics[field] = value
                                  else:
                                      diagnostics[field] = None
                                      invalid_field = True

                              counts = Counter()
                              invalid_denial = False
                              denials = result.get('permission_denials', [])
                              if not isinstance(denials, list):
                                  denials = [None]
                              for denial in denials:
                                  tool_name = (denial.get('tool_name')
                                               if isinstance(denial, dict) else None)
                                  if (not isinstance(tool_name, str)
                                          or not re.fullmatch(
                                              r'[A-Za-z][A-Za-z0-9_.:-]{0,127}',
                                              tool_name)):
                                      tool_name = '<invalid>'
                                      invalid_denial = True
                                  counts[tool_name] += 1
                              diagnostics['denials'] = [
                                  {'tool_name': tool_name, 'count': counts[tool_name]}
                                  for tool_name in sorted(counts)
                              ]
                              if invalid_field or invalid_denial:
                                  diagnostics.update(
                                      available=False,
                                      reason=('INVALID_FIELD' if invalid_field
                                              else 'INVALID_DENIAL'),
                                  )

          encoded = json.dumps(diagnostics, sort_keys=True, indent=2) + '\n'
          output = Path(os.environ['RUNNER_TEMP'], 'claude-review-diagnostics.json')
          output.write_text(encoded, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary_file:
              summary_file.write('## Claude review diagnostics\n\n```json\n' + encoded + '```\n')
          PY

      - name: Upload Claude review diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-review-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-review-diagnostics.json
          if-no-files-found: error

      # Inline workflow code, never a script supplied or generated by the reviewer.
      - name: Record review from GitHub and require a summary
        id: record
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_STARTED_AT: ${{ steps.started.outputs.at }}
          REVIEW_CONCLUSION: ${{ steps.review.outputs.conclusion }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path

          head = os.environ['REVIEW_HEAD']
          run_id = os.environ['REVIEW_RUN_ID']
          record = dict(head_sha=head, run_id=run_id, conclusion='failure',
                        inline_comments=None, summary_comments=None,
                        summary_comment_id=None, summary_sha256=None)

          def timestamp(value):
              parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
              if parsed.tzinfo is None:
                  raise ValueError('Timestamp must include a timezone')
              return parsed

          def comments(endpoint):
              # Explicit pages work with the installed gh and do not truncate at 100.
              for page in range(1, 1001):
                  result = subprocess.run(
                      ['gh', 'api', f'{endpoint}?per_page=100&page={page}'],
                      check=True, capture_output=True, text=True, timeout=30)
                  batch = json.loads(result.stdout)
                  if not isinstance(batch, list):
                      raise ValueError('Expected a comment list')
                  yield from batch
                  if len(batch) < 100:
                      return
              raise ValueError('Comment pagination limit reached')

          try:
              started = timestamp(os.environ['REVIEW_STARTED_AT'])
              repository = os.environ['REVIEW_REPOSITORY']
              pr = os.environ['REVIEW_PR']

              def authored_this_job(comment):
                  user = comment['user']
                  return (user['id'] == 209825114 and user['login'] == 'claude[bot]'
                          and timestamp(comment['created_at']) > started)

              marker = re.compile(
                  rf'^CLAUDE_REVIEW/v1 head={re.escape(head)} run={re.escape(run_id)} '
                  r'verdict=(?:CLEAN|ADVISORY|REPAIR_REQUIRED) findings=[0-9]+$', re.MULTILINE)
              inline = sum(
                  authored_this_job(comment) and comment['commit_id'] == head
                  for comment in comments(f'repos/{repository}/pulls/{pr}/comments'))
              summaries = [comment for comment in comments(f'repos/{repository}/issues/{pr}/comments')
                           if authored_this_job(comment) and bool(marker.search(comment.get('body') or ''))]
              summary = len(summaries)
              record.update(inline_comments=inline, summary_comments=summary)
              if summary == 1:
                  selected = summaries[0]
                  text = selected['body']
                  record.update(summary_comment_id=selected['id'],
                                summary_sha256=__import__('hashlib').sha256(text.encode()).hexdigest())
                  Path(os.environ['RUNNER_TEMP'], 'claude-review-summary.txt').write_text(text, encoding='utf-8')
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write(f"summary_comment_id={selected['id']}\n")
              if (summary == 1 and os.environ['REVIEW_CONCLUSION'] == 'success'
                      and os.environ['REVIEW_OUTCOME'] == 'success'):
                  record['conclusion'] = 'success'
          except Exception:
              # No token, API response body, or model output is copied into diagnostics.
              print('::error::Could not establish review comment evidence from GitHub.')

          encoded = json.dumps(record, sort_keys=True, indent=2) + '\n'
          Path(os.environ['RUNNER_TEMP'], 'claude-review-record.json').write_text(encoded)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary_file:
              summary_file.write('## Claude review record\n\n```json\n' + encoded + '```\n')
          if record['conclusion'] != 'success':
              print('::error::Review requires successful execution and exactly one new Claude summary for this head and run.')
              raise SystemExit(1)
          PY

      - name: Upload review record even when review fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-review-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-review-record.json
          if-no-files-found: error

      - name: Mint Deedseal Review App token
        id: review-app
        if: ${{ steps.record.outcome == 'success' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: '4698242'
          private-key: ${{ secrets.DEEDSEAL_REVIEW_APP_PRIVATE_KEY }}

      - name: Publish exact-head formal review
        if: ${{ steps.record.outcome == 'success' }}
        env:
          DEEDSEAL_REVIEW_APP_TOKEN: ${{ steps.review-app.outputs.token }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_SUMMARY_ID: ${{ steps.record.outputs.summary_comment_id }}
        shell: bash
        run: |
          python3 -I trusted/tools/review_bridge.py --repository "$REVIEW_REPOSITORY" \
            --pr "$REVIEW_PR" --head "$REVIEW_HEAD" --run "$REVIEW_RUN_ID" \
            --summary-id "$REVIEW_SUMMARY_ID" --summary-file "$RUNNER_TEMP/claude-review-summary.txt" \
            --record "$RUNNER_TEMP/deedseal-formal-review-record.json"

      - name: Upload formal review record
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deedseal-formal-review-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deedseal-formal-review-record.json
          if-no-files-found: warn
